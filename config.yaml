# JobPilot behaviour settings. Secrets belong in .env, never here.

llm:
  # Defaults only. Providers, models and privacy mode can be changed at runtime from the UI
  # (Models page) or the API; those choices are stored in the database and override this file.
  # standard: use the routes below. local_only: only providers on localhost/private network.
  privacy_mode: standard
  providers:
    ollama:
      type: openai_compatible            # Ollama, vLLM, LM Studio and any OpenAI-compatible API
      base_url: http://localhost:11434/v1
      # json_object + schema in the prompt. With json_schema (grammar-constrained), local models
      # often stop at a near-empty object because every profile field has a default.
      structured_mode: json_object
      # Skip hidden "thinking" on reasoning models such as qwen3 (measured: 19s vs ~220s for a
      # resume extraction, same result). Set low/medium/high on a provider that needs it.
      reasoning_effort: none
      timeout_s: 300                     # local inference on a laptop can be slow
    anthropic:
      type: anthropic                    # optional; needs ANTHROPIC_API_KEY
  # Open-source models by default. Pull them with `ollama pull <model>`.
  roles:
    reasoning:  {provider: ollama, model: qwen3:8b}
    extraction: {provider: ollama, model: qwen3:8b}
    writing:    {provider: ollama, model: gemma3:12b}
    fast:       {provider: ollama, model: llama3.2:3b}
    router:     {provider: ollama, model: llama3.2:3b}
    judge:      {provider: ollama, model: gemma3:12b}
  # USD per million tokens, used by harness cost budgets. Local models default to 0.
  pricing:
    claude-opus-5-5:   {input: 4.00, output: 20.00}
    claude-sonnet-5-5: {input: 2.00, output: 10.00}
    claude-haiku-5-5:  {input: 0.10, output: 0.50}

rag:
  embedding_provider: fastembed           # fastembed (local ONNX) | hash (tests only)
  embedding_model: BAAI/bge-small-en-v1.5
  top_k: 6
  max_query_rewrites: 2
  min_relevant_chunks: 1

observability:
  langfuse_enabled: true                  # still a no-op unless LANGFUSE_* keys are set
  environment: development
  sample_rate: 1.0
  # Hosts that count as local for privacy_mode=local_only, e.g. [langfuse] for a compose service.
  trusted_trace_hosts: []

evaluation:
  online_sample_rate: 0.1                 # share of production RAG calls scored by TruLens
  groundedness_gate: 0.9

application:
  daily_cap_per_portal: 25
  answer_confidence_threshold: 0.8
  presubmit_preview: true
  min_delay_seconds: 20
  max_delay_seconds: 75

email:
  poll_interval_minutes: 15
  otp_max_age_minutes: 10
  first_poll_lookback_days: 7          # how far back the first poll after connecting looks
  max_messages_per_poll: 50
  calendar:                            # used only when calendar access is enabled
    timezone: Asia/Kolkata
    work_start: "10:00"
    work_end: "18:00"
    slot_minutes: 60
    days_ahead: 5

portals:
  # Off by default: automated use may breach a portal's terms (see README). Enable per portal on
  # the Jobs page, which records your acceptance, or list names here (naukri, linkedin, shine).
  enabled: []
  browser_channel: chrome     # drive your installed Chrome; set to null for Playwright's Chromium
  headed: false               # searches run in the background; sign-in always opens a window
  min_delay_seconds: 4        # human-paced gap between page loads
  max_delay_seconds: 12

notifications:
  # desktop (macOS / Linux notify-send) | telegram (TELEGRAM_BOT_TOKEN + chat id) |
  # webhook (JOBPILOT_NOTIFY_WEBHOOK_URL, e.g. a WhatsApp/Slack bridge). H6 always shows in the UI.
  channels: [desktop]
  telegram_chat_id: ""

api:
  host: 127.0.0.1
  port: 8765
