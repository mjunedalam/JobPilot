# JobPilot behaviour settings. Secrets belong in .env, never here.

llm:
  # standard: use the routes below. local_only: every role goes to `local_provider` (no PII leaves the host).
  privacy_mode: standard
  local_provider: local
  providers:
    anthropic:
      type: anthropic
    local:
      type: openai_compatible            # Ollama, vLLM, LM Studio, TGI
      base_url: http://localhost:11434/v1
      api_key_env: OLLAMA_API_KEY        # optional; Ollama ignores it
  roles:
    reasoning:
      provider: anthropic
      model: claude-opus-5-5
      fallbacks: [{provider: local, model: qwen3:14b}]
    extraction: {provider: anthropic, model: claude-sonnet-5-5}
    writing:    {provider: anthropic, model: claude-opus-5-5}
    fast:
      provider: anthropic
      model: claude-haiku-5-5
      fallbacks: [{provider: local, model: llama3.2:3b}]
    router: {provider: anthropic, model: claude-haiku-5-5}
    judge:  {provider: anthropic, model: claude-sonnet-5-5}
  # USD per million tokens, used by harness cost budgets. Local models default to 0.
  pricing:
    claude-opus-5-5:   {input: 4.00, output: 20.00}
    claude-sonnet-5-5: {input: 2.00, output: 10.00}
    claude-haiku-5-5:  {input: 0.10, output: 0.50}

rag:
  embedding_provider: fastembed           # fastembed (local ONNX) | hash (tests only)
  embedding_model: BAAI/bge-small-en-v1.5
  top_k: 6
  max_query_rewrites: 2
  min_relevant_chunks: 1

observability:
  langfuse_enabled: true                  # still a no-op unless LANGFUSE_* keys are set
  environment: development
  sample_rate: 1.0

evaluation:
  online_sample_rate: 0.1                 # share of production RAG calls scored by TruLens
  groundedness_gate: 0.9

application:
  daily_cap_per_portal: 25
  answer_confidence_threshold: 0.8
  presubmit_preview: true
  min_delay_seconds: 20
  max_delay_seconds: 75

email:
  poll_interval_minutes: 15
  otp_max_age_minutes: 10

portals:
  # Adapters other than official APIs are off by default. See the ToS note in README.md.
  enabled: []

notifications:
  channels: [desktop]

api:
  host: 127.0.0.1
  port: 8765
