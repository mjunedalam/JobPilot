<html><body><form id="apply">
  <label for="notice">Notice period *</label>
  <select id="notice" name="notice" required><option value="">Select</option><option>Immediate</option>
    <option>1 month</option><option>2 months</option><option>3 months</option></select>
  <fieldset><legend>Are you willing to relocate? *</legend>
    <label><input type="radio" name="relocate" value="y" required> Yes</label>
    <label><input type="radio" name="relocate" value="n"> No</label></fieldset>
  <label for="ectc">Expected CTC (in lakhs) *</label><input id="ectc" name="ectc" type="number" required>
  <label for="why">Why do you want to join Acme? *</label><textarea id="why" name="why" required></textarea>
  <label for="cover">Cover letter (optional)</label><textarea id="cover" name="cover"></textarea>
  <button type="submit" id="submit">Submit application</button>
</form></body></html>
